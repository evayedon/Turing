[package]
name = "turing-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Native lifecycle smoke harness (see docs/architecture.md). Never enabled in
# normal or release builds.
smoke = []
# Performance baseline on top of the smoke harness (see docs/architecture.md).
# Also never enabled in normal or release builds.
perf = ["smoke"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cap-std = "4"
cap-fs-ext = "4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
tempfile = "3"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "0.1.15"
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
