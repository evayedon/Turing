[package]
name = "turing-core"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cap-std = "4"
cap-fs-ext = "4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
