[[permission]]
identifier = "allow-workspace-readonly"
description = "Open or close a native workspace and read approved directory entries and text files."
commands.allow = [
  "workspace_open",
  "workspace_close",
  "fs_list_directory",
  "fs_read_file",
]

[[permission]]
identifier = "allow-workspace-edit"
description = "Save approved text files and handle editor close confirmation."
commands.allow = ["fs_write_file", "editor_confirm_discard", "editor_exit"]

[[permission]]
identifier = "allow-editor-selected-files"
description = "Use native pickers and access only the resulting individual file grants."
commands.allow = ["file_open", "file_read", "file_write", "file_close", "file_save_as"]

[[permission]]
identifier = "allow-workspace-search"
description = "Start, scan, and cancel a bounded text search in the active authorized workspace."
commands.allow = ["workspace_search_begin", "workspace_search_run", "workspace_search_cancel"]

[[permission]]
identifier = "allow-workspace-entry-mutations"
description = "Create a new file and rename a listed regular workspace entry without replacing an existing name."
commands.allow = ["workspace_create_file", "workspace_rename_entry"]

[[permission]]
identifier = "allow-workspace-watch"
description = "Poll coalesced change hints for the active authorized workspace."
commands.allow = ["workspace_watch_poll"]
