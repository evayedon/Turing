name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    # Weekly performance baseline: Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      # The hosted macOS and Windows images already provide native build toolchains.
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          # Slow downloads from the hosted runner's regional mirror have
          # exhausted the job timeout before the native smoke checks.
          sudo sed -i 's#http://us-east-2.ec2.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap
          # The agent sandbox prefers bubblewrap, which needs unprivileged user
          # namespaces; Ubuntu 24.04 restricts them through AppArmor by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Rust and rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      # Tauri builds the frontend first, then compiles for the runner's native target.
      - name: Build desktop without installers
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:desktop --no-bundle -- --locked

      - name: Report installed Windows execution toolchains
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command python.exe, clang++.exe, g++.exe, rustc.exe, dotnet.exe -All -ErrorAction SilentlyContinue |
            Select-Object Name, Source | Format-Table
          rustc -vV
          dotnet --list-sdks

      - name: Test native workspace authorization
        if: runner.os != 'Windows'
        env:
          TURING_CI_REQUIRE_SANDBOX: "1"
        run: cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Keep cold toolchain launches from competing with one another and with
      # filesystem stress tests on the hosted Windows runner.
      - name: Test Windows execution toolchains
        if: runner.os == 'Windows'
        env:
          TURING_CI_REQUIRE_WINDOWS_TOOLCHAINS: "1"
          TURING_CI_REQUIRE_SANDBOX: "1"
        run: |
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml execution:: -- --test-threads=1

      - name: Test remaining Windows native coverage
        if: runner.os == 'Windows' && !cancelled()
        run: |
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --skip execution::

      - name: Install managed language servers for integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends clangd
          npm i -g typescript-language-server@6.1.0 typescript@~5.9.0 pyright@1.1.414
          rustup component add rust-analyzer

      - name: Test managed language servers against real projects
        if: runner.os == 'Linux'
        run: |
          export TURING_TEST_CLANGD="$(readlink -f "$(command -v clangd)")"
          "$TURING_TEST_CLANGD" --version
          export TURING_TEST_TSLS="$(command -v typescript-language-server)"
          export TURING_TEST_PYRIGHT="$(command -v pyright-langserver)"
          export TURING_TEST_RUST_ANALYZER="$(rustup which rust-analyzer)"
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml language:: -- --ignored

      # Native lifecycle smoke harness: the real app opens and closes two
      # workbench and two terminal windows. The non-default `smoke` feature is
      # never part of the shipped build above. See docs/architecture.md.
      - name: Test lifecycle smoke harness logic
        run: cargo test --release --locked --features smoke --manifest-path apps/desktop/src-tauri/Cargo.toml smoke::tests

      - name: Build lifecycle smoke harness without installers
        run: cargo build --release --locked --features smoke,tauri/custom-protocol --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Run native lifecycle smoke
        timeout-minutes: 5
        shell: bash
        env:
          TURING_SMOKE: "1"
          TURING_SMOKE_TIMEOUT_SECS: "180"
          TURING_SMOKE_OUTPUT: ${{ runner.temp }}/turing-smoke.json
          # Software rendering for WebKitGTK under Xvfb; ignored elsewhere.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          binary=apps/desktop/src-tauri/target/release/turing-core
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          status=0
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" "$binary" || status=$?
          else
            "$binary" || status=$?
          fi
          echo "Smoke summary:"
          cat "$TURING_SMOKE_OUTPUT" || echo "No summary was written."
          exit "$status"

      - name: Capture startup and interaction baseline
        # Perf runs only; a failed capture fails the job so a missing result is visible.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        timeout-minutes: 12
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          cargo build --release --locked --features perf,tauri/custom-protocol --manifest-path apps/desktop/src-tauri/Cargo.toml
          output="$RUNNER_TEMP/turing-perf-baseline.json"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node apps/desktop/scripts/perf-baseline.mjs --output "$output"
          else
            node apps/desktop/scripts/perf-baseline.mjs --output "$output"
          fi

      - name: Upload startup and interaction baseline
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: turing-perf-${{ matrix.os }}
          path: ${{ runner.temp }}/turing-perf-baseline.json
          if-no-files-found: error
